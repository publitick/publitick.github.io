<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="public, max-age=86400">
  <meta http-equiv="Expires" content="86400">
  <title>PUBLIēTIKA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --accent: #c41a1a;
      --muted: #888888;
      --divider: #dddddd;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier Prime', monospace;
      font-weight: 400;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      font-family: 'Special Elite', monospace;
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      color: var(--fg);
    }

    .nav-cta {
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-cta:hover { color: var(--fg); }

    /* HERO */
    header {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 2rem 2rem;
      gap: 2rem;
    }

    .logo-wrap {
      width: 140px;
    }

    h1 {
      font-family: 'Special Elite', monospace;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--fg);
    }

    .tagline {
      font-size: clamp(1rem, 2vw, 1.1rem);
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* SERVICES */
    section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--divider);
      margin-top: 4rem;
    }

    .service {
      padding: 3rem 2.5rem;
      border-right: 1px solid var(--divider);
    }
    .service:last-child { border-right: none; }

    .service-num {
      font-size: 1rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 1.5rem;
      display: block;
    }

    h2 {
      font-family: 'Special Elite', monospace;
      font-size: clamp(1.3rem, 2.2vw, 1.65rem);
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 1rem;
      color: var(--fg);
    }

    .service p {
      font-size: 1.15rem;
      color: var(--muted);
      line-height: 1.7;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--divider);
      padding: 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-brand {
      font-family: 'Special Elite', monospace;
      font-size: 1.5rem;
      color: var(--fg);
    }

    .footer-right {
      text-align: right;
    }

    .footer-tagline {
      font-size: 1rem;
      color: var(--fg);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.4rem;
    }

    .footer-copy {
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {
      nav { padding: 0.5rem 1.5rem; }
      header { padding: 1rem 1.5rem 2rem; }
      section { grid-template-columns: 1fr; }
      .service { border-right: none; border-bottom: 1px solid var(--divider); }
      .service:last-child { border-bottom: none; }
      footer { flex-direction: column; gap: 1.5rem; text-align: center; padding: 2rem 1.5rem; }
      .footer-right { text-align: center; }
      .service { text-align: center; }
      h1, .tagline { text-align: center; }
    }
  </style>
</head>
<body>

  <nav></nav>

  <header>
    <div class="logo-wrap">
      <svg viewBox="0 0 138 142" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Recuadro que engloba P + ē + mancha -->
        <rect x="2" y="2" width="132" height="136" stroke="#111111" stroke-width="3" fill="none"/>

        <!-- P grande -->
        <text x="0" y="130" font-family="'Special Elite', monospace" font-size="140"
              fill="#111111">P</text>

        <!-- ē -->
        <text x="58" y="130" font-family="'Special Elite', monospace" font-size="52"
              fill="#111111">ē</text>

        <!-- Mancha de tinta roja sobre la ē -->
        <ellipse cx="112" cy="94" rx="9" ry="6" fill="#c41a1a" opacity="0.82" transform="rotate(-15 112 94)"/>
        <circle cx="121" cy="89" r="3.5" fill="#c41a1a" opacity="0.55"/>
        <circle cx="102" cy="88" r="2.5" fill="#c41a1a" opacity="0.45"/>
        <circle cx="122" cy="100" r="2" fill="#c41a1a" opacity="0.35"/>
      </svg>
    </div>
    <h1>PUBLIēTIKA</h1>
    <p class="tagline">Marketing con conciencia</p>
  </header>

  <section>
    <div class="service">
      <span class="service-num">01</span>
      <h2>Publicidad Online</h2>
      <p>Impacto real sin manipulación.</p>
    </div>
    <div class="service">
      <span class="service-num">02</span>
      <h2>Creación de Imagen</h2>
      <p>Una identidad que refleja tus valores.</p>
    </div>
    <div class="service">
      <span class="service-num">03</span>
      <h2>Eventos</h2>
      <p>Experiencias que conectan con propósito.</p>
    </div>
  </section>

  <footer>
    <span class="footer-brand">PUBLIēTIKA</span>
    <div class="footer-right">
      <span class="footer-tagline">Marketing con conciencia</span>
      <span class="footer-copy">© 2026 PUBLIēTIKA</span>
    </div>
  </footer>

</body>
</html>
